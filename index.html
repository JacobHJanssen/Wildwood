<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wildwood CC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --navy: #002349; --gold: #c5a059; }
        body { 
            font-family: -apple-system, sans-serif;
            /* High-compatibility background color if image fails */
            background-color: var(--navy);
            background-image: linear-gradient(rgba(0,35,73,0.8), rgba(0,35,73,0.8)), url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            margin: 0; padding: 10px; height: 100vh;
        }
        .app-container { 
            max-width: 600px; margin: auto; background: rgba(255, 255, 255, 0.98); 
            border-radius: 15px; overflow: hidden; border-top: 10px solid var(--gold); 
        }
        .header { padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        .clock-bar { background: #fcf8ef; color: var(--navy); padding: 8px; text-align: center; font-weight: bold; font-size: 13px; border-bottom: 2px solid var(--gold); }
        .form-area { padding: 20px; }
        input { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 20px; background: var(--navy); color: gold; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; margin-top: 10px; }
        .tabs { display: flex; background: #f4f4f4; }
        .tab { flex: 1; padding: 15px; text-align: center; font-size: 12px; font-weight: bold; color: #888; cursor: pointer; }
        .tab.active { background: white; color: var(--navy); border-top: 4px solid var(--gold); }
        .hidden { display: none; }
        .owner-mark { padding: 10px; text-align: center; font-size: 10px; color: #999; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2 style="margin:0; color:var(--navy); letter-spacing:2px;">WILDWOOD</h2>
        <small style="color:var(--gold); font-weight:bold;">CART MANAGER</small>
    </div>
    <div class="clock-bar" id="clk">MINOT, ND | LOADING TIME...</div>
    
    <div class="tabs">
        <div class="tab active" onclick="setView('form')">CHECK OUT</div>
        <div class="tab" onclick="setView('live')">ACTIVE</div>
        <div class="tab" onclick="setView('hist')">LOGS 🔒</div>
    </div>

    <div id="vForm" class="form-area">
        <input type="text" id="n" placeholder="Golfer Name">
        <input type="tel" id="p" placeholder="Phone Number">
        <input type="text" id="d" placeholder="Driver's License #">
        <input type="number" id="c" placeholder="Cart #">
        <div style="font-size:11px; margin:10px 0; padding:10px; border:1px solid #ccc; height:50px; overflow-y:scroll;">
            Must have valid DL. Stay on paths. Renter liable for damages.
        </div>
        <button class="btn-main" onclick="saveData()">COMPLETE CHECKOUT</button>
    </div>

    <div id="vLive" class="hidden"><table id="listL" style="width:100%; border-collapse:collapse;"></table></div>
    <div id="vHist" class="hidden" style="padding:15px;"><table id="listH" style="width:100%; font-size:12px;"></table></div>
    
    <div class="owner-mark">DESIGNED BY JAKE JANSSEN</div>
</div>

<script>
    function updateClock() {
        const d = new Date();
        document.getElementById('clk').innerText = "MINOT, ND | " + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000); updateClock();

    let logs = JSON.parse(localStorage.getItem('ww_logs')) || [];

    function saveData() {
        let entry = {
            name: document.getElementById('n').value,
            cart: document.getElementById('c').value,
            out: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
            in: '--', status: 'OUT'
        };
        logs.push(entry);
        localStorage.setItem('ww_logs', JSON.stringify(logs));
        alert("Cart #" + entry.cart + " Checked Out!");
        location.reload();
    }

    function setView(v) {
        if(v === 'hist' && prompt("PIN:") !== "2020") return;
        document.getElementById('vForm').classList.add('hidden');
        document.getElementById('vLive').classList.add('hidden');
        document.getElementById('vHist').classList.add('hidden');
        document.getElementById('v' + v.charAt(0).toUpperCase() + v.slice(1)).classList.remove('hidden');
        render();
    }

    function render() {
        let l = document.getElementById('listL'); l.innerHTML = '';
        logs.forEach((item, i) => {
            if(item.status === 'OUT') {
                l.innerHTML += `<tr style="border-bottom:1px solid #eee;"><td style="padding:15px;">#${item.cart} - ${item.name}</td><td align="right"><button onclick="checkIn(${i})" style="background:green; color:white; border:none; padding:10px; border-radius:5px;">RETURN</button></td></tr>`;
            }
        });
    }

    function checkIn(i) {
        logs[i].status = 'IN';
        logs[i].in = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        localStorage.setItem('ww_logs', JSON.stringify(logs));
        render();
    }

    render();
</script>
</body>
</html>
